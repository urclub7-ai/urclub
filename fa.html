<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <!-- Primary Meta Tags -->
  <title>URCLUB | صفحه اختصاصی و لینک‌ها</title>
  <meta name="title" content="URCLUB | صفحه اختصاصی و لینک‌ها" />
  <meta name="description" content="Official URCLUB Bio & Links" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />

  <!-- Open Graph / WhatsApp / Telegram / Facebook Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="URCLUB" />
  <meta property="og:url" content="https://urclub.vercel.app/fa" />
  <meta property="og:title" content="URCLUB | صفحه اختصاصی و لینک‌ها" />
  <meta property="og:description" content="Official URCLUB Bio & Links" />
  <meta property="og:image" content="https://urclub.vercel.app/assets/logo.jpg" />
  <meta property="og:image:secure_url" content="https://urclub.vercel.app/assets/logo.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="1024" />
  <meta property="og:image:alt" content="URCLUB Official Shield Logo" />

  <!-- Twitter / X Preview -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://urclub.vercel.app/fa" />
  <meta name="twitter:title" content="URCLUB | صفحه اختصاصی و لینک‌ها" />
  <meta name="twitter:description" content="Official URCLUB Bio & Links" />
  <meta name="twitter:image" content="https://urclub.vercel.app/assets/logo.jpg" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Click/Tap to Enter Screen -->
  <div id="enter-overlay" class="enter-overlay">
    <div class="enter-content">
      <p class="enter-text" id="enter-text">[ برای ورود به وبسایت کلیک کنید ]</p>
    </div>
  </div>

  <!-- Background Video (Video + Audio) & Dot-Matrix Grid Overlay -->
  <div class="bg-wrapper">
    <canvas id="bg-canvas"></canvas>
    <video id="bg-video" autoplay loop muted playsinline webkit-playsinline x5-playsinline preload="auto"></video>
    <!-- Dot Matrix Pattern -->
    <div class="bg-dot-matrix" id="bg-dot-matrix"></div>
    <div class="bg-vignette"></div>
  </div>

  <!-- Top Corner: Floating Order Button & Language Switcher (Persian Version) -->
  <button id="btn-open-order-modal" class="floating-order-btn" title="ثبت سفارش اختصاصی">
    <i class="fa-solid fa-cart-shopping"></i>
    <span>سفارش</span>
  </button>

  <a href="index.html" class="lang-switch-pill" title="View English Version">
    <i class="fa-solid fa-globe"></i>
    <span>EN</span>
  </a>

  <!-- Order Access Code Verification Modal (Persian) -->
  <div id="modal-order-gate" class="order-modal-backdrop" style="display: none;">
    <div class="order-modal-card">
      <button type="button" id="btn-close-order-modal" class="order-modal-close" title="بستن">&times;</button>
      
      <div class="order-modal-header">
        <div class="order-modal-icon-badge">
          <i class="fa-solid fa-key"></i>
        </div>
        <h2 class="order-modal-title">ورود به بخش ثبت سفارش</h2>
        <p class="order-modal-desc">
          برای دسترسی به فرم و ثبت مشخصات پروژه کد خود را وارد کنید
        </p>
      </div>

      <form id="order-code-form" class="order-code-form" autocomplete="off">
        <div class="order-input-wrapper">
          <input 
            type="text" 
            id="order-code-input" 
            class="order-code-input" 
            placeholder="" 
            maxlength="14" 
            required 
            spellcheck="false"
          />
        </div>

        <div id="order-code-error" class="order-code-error" style="display: none;"></div>

        <button type="submit" id="btn-verify-order-code" class="btn-verify-order">
          <span class="btn-verify-text"><i class="fa-solid fa-arrow-left"></i> تایید و ورود به فرم</span>
          <span class="btn-verify-spinner" style="display: none;"><i class="fa-solid fa-spinner fa-spin"></i> در حال بررسی کد...</span>
        </button>
      </form>

      <div class="order-modal-footer">
        <button type="button" id="btn-no-code" class="btn-no-code-link">
          کد ندارم
        </button>
      </div>
    </div>
  </div>

  <!-- Admin WhatsApp Contact Modal (کد ندارم) -->
  <div id="modal-admin-contact" class="admin-contact-backdrop" style="display: none;">
    <div class="admin-contact-card">
      <button type="button" id="btn-close-admin-contact" class="admin-contact-close" title="بستن">&times;</button>
      
      <div class="admin-contact-avatar-wrap">
        <img id="admin-contact-avatar" class="admin-contact-avatar" src="assets/logo.png" alt="Admin Profile" />
        <span class="admin-contact-status-dot"></span>
      </div>

      <p class="admin-contact-text">برای دریافت کد سفارش خود را ثبت کنید.</p>

      <a id="admin-contact-wa-link" href="https://wa.me/491624212685?text=%D8%B3%D9%84%D8%A7%D9%85%D8%8C%20%D8%A8%D8%B1%D8%A7%DB%8C%20%D8%AF%D8%B1%DB%8C%D8%A7%D9%81%D8%AA%20%DA%A9%D8%AF%20%D8%B3%D9%81%D8%A7%D8%B1%D8%B4%20%D8%AE%D9%88%D8%AF%20%D8%B1%D8%A7%20%D8%AB%D8%A8%D8%AA%20%DA%A9%D9%86%D9%85." target="_blank" class="admin-contact-wa-btn">
        <i class="fa-brands fa-whatsapp"></i>
        <span dir="ltr">+49 162 4212685</span>
      </a>
    </div>
  </div>

  <!-- Center Profile Container -->
  <main class="profile-container">
    
    <!-- Profile Avatar (Main) -->
    <div class="avatar-container" id="avatar-container">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a855f7'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E" alt="Avatar" id="profile-avatar" class="profile-avatar" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23a855f7\'%3E%3Cpath d=\'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z\'/%3E%3C/svg%3E'" />
    </div>

    <!-- Sparkle Name Container -->
    <div class="name-container">
      <h1 id="profile-name" class="profile-name">
        <span id="name-text">لوی</span>
        <span class="sparkle s1">✦</span>
        <span class="sparkle s2">✧</span>
        <span class="sparkle s3">✦</span>
        <span class="sparkle s4">✧</span>
        <span class="sparkle s5">✦</span>
      </h1>
    </div>

    <!-- Subtitle / Role -->
    <p id="profile-subtitle" class="profile-subtitle" style="display: none;"></p>

    <!-- Presence / Activity Pill Widget -->
    <div class="presence-widget" id="presence-widget">
      <div class="presence-avatar-wrap">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a855f7'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E" alt="Mini Avatar" id="presence-mini-avatar" class="presence-mini-avatar" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23a855f7\'%3E%3Cpath d=\'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z\'/%3E%3C/svg%3E'" />
        <span class="presence-status-ring" id="presence-status-ring"></span>
      </div>
      <div class="presence-info">
        <span id="presence-handle" class="presence-handle">levi</span>
        <span id="presence-status" class="presence-status">آنلاین</span>
      </div>
    </div>

    <!-- Horizontal Social Media Icons -->
    <div class="socials-row" id="socials-row">
      <!-- Generated dynamically -->
    </div>

    <!-- Views Counter (Bottom) -->
    <div class="views-pill">
      <i class="fa-solid fa-eye"></i>
      <span id="views-count">10</span>
    </div>

  </main>

  <!-- Supabase Cloud Sync -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Storage & Dynamic Engine -->
  <script src="storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
